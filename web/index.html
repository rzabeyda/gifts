<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gifts Monitor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#000; --card:#0f0f12; --card2:#16161b; --line:#1d1d23; --text:#f2f2f3; --mute:#8a8a90;
    --acc:#ff2fb9; --acc2:#c026d3; --up:#2ecc71; --down:#ff5a5f; --spring:cubic-bezier(.34,1.56,.64,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:430px; margin:0 auto; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  #app::before { content:""; position:absolute; inset:0 0 auto 0; height:260px; pointer-events:none; z-index:0;
    background:radial-gradient(120% 100% at 50% -20%, rgba(255,47,185,.18), transparent 70%); }
  main { flex:1; overflow-y:auto; padding:14px 16px 24px; position:relative; z-index:1; }
  main::-webkit-scrollbar { width:0; }
  h1 { font-size:24px; margin:4px 0 14px; font-weight:800; letter-spacing:-.3px; }
  .view-in { animation:fade .28s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
  .anim { animation:rise .38s var(--spring) both; animation-delay:calc(var(--i, 0) * 28ms); }

  /* интерактивность: нажатие, наведение, волна */
  .rp { position:relative; overflow:hidden; transition:transform .16s var(--spring), background .2s, border-color .2s, box-shadow .2s; cursor:pointer; }
  .rp:active { transform:scale(.965); }
  @media (hover:hover) { .rp:hover { border-color:rgba(255,47,185,.45); box-shadow:0 0 0 1px rgba(255,47,185,.15), 0 8px 24px rgba(0,0,0,.5); } }
  .ripple { position:absolute; border-radius:50%; background:rgba(255,47,185,.28); transform:scale(0); pointer-events:none; animation:rip .6s ease-out forwards; }
  @keyframes rip { to { transform:scale(1); opacity:0; } }

  .search { width:100%; padding:13px 16px; border-radius:16px; border:1px solid var(--line); background:var(--card);
    color:var(--text); font-size:16px; margin-bottom:12px; outline:none; transition:border-color .2s, box-shadow .2s; }
  .search:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(255,47,185,.18); }

  .seg { display:flex; gap:8px; margin:0 0 14px; }
  .seg button { flex:1; padding:10px 0; border-radius:14px; border:1px solid var(--line); background:var(--card);
    color:var(--mute); font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  .seg button.on { color:#fff; border-color:transparent; background:linear-gradient(135deg, rgba(255,47,185,.9), rgba(192,38,211,.9));
    box-shadow:0 6px 20px rgba(255,47,185,.28); }
  .seg .arr { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s var(--spring); }
  .seg .arr.down { transform:rotate(180deg); }

  /* строки */
  .row { display:flex; align-items:center; gap:14px; padding:12px 14px; margin-bottom:10px; border-radius:20px;
    background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); }
  .row { content-visibility:auto; contain-intrinsic-size:auto 92px; }
  .row img { width:66px; height:66px; border-radius:16px; background:var(--card); object-fit:cover; flex:none; opacity:0; transition:opacity .3s; }
  .row img.ok { opacity:1; }
  .row .t { flex:1; min-width:0; }
  .row .n { font-weight:700; font-size:17px; line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
  .row .s { color:var(--mute); font-size:14px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .p { text-align:right; font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; flex:none; }
  .row .p small { display:block; font-size:13.5px; font-weight:600; margin-top:2px; }
  .gem { width:15px; height:15px; vertical-align:-2px; margin-left:3px; fill:#3ea6ff; }
  .sp { width:62px; height:32px; flex:none; }
  .row { gap:11px; }
  .up { color:var(--up); } .dn { color:var(--down); } .fl { color:var(--mute); }
  .chg svg { width:12px; height:12px; vertical-align:-1px; fill:currentColor; margin-right:2px; }

  .back, #lb-close { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 22px 11px 14px;
    border-radius:999px; border:1.5px solid var(--acc); background:rgba(255,47,185,.14); color:var(--acc); font-size:17px; font-weight:700; }
  .back { margin:2px 0 14px; }
  .back svg, #lb-close svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }

  /* подборки */
  .tgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tcard { border-radius:22px; padding:14px; height:152px; border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(145deg, hsla(var(--h),75%,38%,.42), var(--card) 75%); }
  .tcard .stack { display:flex; height:58px; }
  .tcard .stack img { width:58px; height:58px; border-radius:16px; object-fit:cover; margin-right:-18px; background:var(--card);
    border:2px solid #0b0b0d; opacity:0; transition:opacity .3s; }
  .tcard .stack img.ok { opacity:1; }
  .tcard .tt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:17px; font-weight:800; margin-top:10px; letter-spacing:-.2px; }
  .tcard .ts { color:#b9bcc4; font-size:13px; margin-top:2px; }

  nav { display:flex; gap:6px; margin:0 14px calc(12px + env(safe-area-inset-bottom)); padding:7px; position:relative; z-index:3;
    border:1px solid var(--line); border-radius:28px; background:#0c0c10; }
  nav button { flex:1; background:none; border:0; color:var(--mute); padding:9px 0 7px; font-size:12px; font-weight:600; border-radius:22px;
    transition:color .2s, background .25s, transform .16s var(--spring); }
  nav button:active { transform:scale(.93); }
  nav button.on { color:#fff; background:linear-gradient(135deg, rgba(255,47,185,.28), rgba(192,38,211,.22)); box-shadow:inset 0 0 0 1px rgba(255,47,185,.35); }
  nav svg { display:block; margin:0 auto 3px; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; transition:transform .3s var(--spring), filter .3s; }
  nav button.on svg { transform:translateY(-2px) scale(1.12); filter:drop-shadow(0 0 6px rgba(255,47,185,.8)); }

  .big { font-size:36px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .empty { color:var(--mute); text-align:center; padding:40px 12px; }
  footer { color:var(--mute); font-size:12px; text-align:center; padding:16px 0 4px; }
  footer a { color:var(--mute); }

  /* кнопка «наверх» */
  #back-fab { position:absolute; left:16px; bottom:100px; width:42px; height:42px; border-radius:50%; border:0; z-index:6; color:#fff;
    background:linear-gradient(135deg, var(--acc2), var(--acc)); box-shadow:0 8px 26px rgba(192,38,211,.5), inset 0 1px 0 rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; opacity:0; transform:translateX(-24px) scale(.4); pointer-events:none;
    transition:opacity .25s, transform .35s var(--spring); }
  #back-fab.show { opacity:1; transform:none; pointer-events:auto; }
  #back-fab:active { transform:scale(.88); }
  #back-fab svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
  #up { position:absolute; right:16px; bottom:100px; width:42px; height:42px; border-radius:50%; border:0; z-index:6; color:#fff;
    background:linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow:0 8px 26px rgba(255,47,185,.5), inset 0 1px 0 rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; opacity:0; transform:translateY(24px) scale(.4); pointer-events:none;
    transition:opacity .25s, transform .35s var(--spring); }
  #up.show { opacity:1; transform:none; pointer-events:auto; animation:glow 2.4s ease-in-out infinite; }
  #up:active { transform:scale(.88); }
  #up svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes glow { 50% { box-shadow:0 8px 34px rgba(192,38,211,.7), inset 0 1px 0 rgba(255,255,255,.35); } }

  /* карточка модели */
  #lb { position:fixed; inset:0; background:#000; display:none; flex-direction:column; align-items:center; z-index:20;
    padding:20px 16px 28px; text-align:center; overflow-y:auto; }
  #lb.show { display:flex; animation:fade .22s ease both; }
  #lb img { max-width:100%; max-height:32vh; object-fit:contain; flex:none; filter:drop-shadow(0 12px 36px rgba(255,47,185,.35)); animation:pop .45s var(--spring) both; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:none; opacity:1; } }
  #lb-t { font-size:20px; font-weight:800; margin-top:16px; }
  #lb-s { color:var(--mute); margin-top:8px; line-height:1.7; }
  #lb-s b { color:var(--text); }
  #lb-ctl { width:100%; max-width:430px; margin-top:14px; }
  #lb-chart { min-height:150px; }
  #lb-close { margin-top:14px; width:100%; }
  .seg-s { margin-top:-4px; } .seg-s button { padding:7px 0; font-size:13px; border-radius:12px; }
  #lb-body { width:100%; max-width:430px; }
  #lb-body.sl { animation:slL .28s ease both; } #lb-body.sr { animation:slR .28s ease both; }
  @keyframes slL { from { opacity:0; transform:translateX(46px); } to { opacity:1; transform:none; } }
  @keyframes slR { from { opacity:0; transform:translateX(-46px); } to { opacity:1; transform:none; } }
  #lb-imgwrap { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  #lb-imgwrap img { flex:1; min-width:0; }
  .lbn { width:44px; height:44px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--card2); color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:transform .16s var(--spring); }
  .lbn:active { transform:scale(.88); }
  .lbn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  #lb-pos { color:var(--mute); font-size:13px; margin-top:10px; min-height:18px; }
  .gcard { border:1px solid var(--line); border-radius:22px; padding:14px 12px 12px; margin-bottom:16px;
    background:linear-gradient(180deg, var(--card2), var(--card)); }
  .gprice { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px; margin-top:-6px; }
  .gprice .s { font-size:16px; font-weight:700; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .top .hico { width:46px; height:46px; flex:none; margin:0 0 10px; object-fit:contain; }
  .shr { flex:none; width:36px; height:36px; margin:0 0 10px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); padding:0; }
  .shr svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .shr img { width:100%; height:100%; border-radius:50%; display:block; }
  #share { padding:0; border:0; overflow:hidden; background:transparent; }
  .top .hico ~ h1 { font-size:21px; }
  .top h1 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lang { display:flex; flex:none; margin-bottom:10px; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  .lang span { padding:5px 10px; border-radius:999px; font-size:12px; font-weight:800; color:var(--mute); transition:background .2s, color .2s; }
  .lang span.on { color:#fff; background:linear-gradient(135deg, var(--acc), var(--acc2)); }
  .mnote { color:var(--mute); font-size:12.5px; margin:2px 0 10px; }
  .mmap { position:relative; width:100%; border-radius:20px; overflow:hidden; background:#08080a; border:1px solid var(--line); }
  .mtile { position:absolute; border-radius:11px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; text-align:center; color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -14px 26px rgba(0,0,0,.2), 0 1px 3px rgba(0,0,0,.4);
    animation:mpop .45s var(--spring) both; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .mtile img { object-fit:contain; flex:none; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
  .mtile b { font-size:15px; font-weight:800; line-height:1.1; padding:0 4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mtile span { font-size:13px; font-weight:700; opacity:.95; display:flex; align-items:center; gap:1px; }
  .mtile span .gem { fill:#fff; margin:0; width:12px; height:12px; }
  .mtile em { font-style:normal; font-size:11.5px; font-weight:800; opacity:.95; }
  @keyframes mpop { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:none; } }
  .mlegend { display:flex; align-items:center; gap:8px; margin:12px 4px 4px; color:var(--mute); font-size:12px; font-weight:700; }
  .mlegend i { flex:1; height:8px; border-radius:99px; background:linear-gradient(90deg, hsl(358 78% 44%), #3b3f48 50%, hsl(146 70% 44%)); }
  .bub { position:absolute; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    text-align:center; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.55); animation:mpop .55s var(--spring) both;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 -22px 34px rgba(0,0,0,.28), 0 10px 26px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.07); }
  .bub img { object-fit:contain; flex:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
  .bub b { font-size:14px; font-weight:800; line-height:1.1; max-width:88%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bub span { font-size:13px; font-weight:700; display:flex; align-items:center; gap:1px; }
  .bub span .gem { fill:#fff; margin:0; width:12px; height:12px; }
  .bub em { font-style:normal; font-size:12px; font-weight:800; opacity:.95; }
  .buy { display:flex; align-items:center; justify-content:center; width:100%; padding:14px; border-radius:18px; border:0; color:#fff;
    font-size:17px; font-weight:800; background:linear-gradient(135deg, #2ecc71, #17a05a); box-shadow:0 8px 24px rgba(46,204,113,.32), inset 0 1px 0 rgba(255,255,255,.3); margin:0 0 14px; }
  #lb-buy { margin:14px 0 0; }
  #sheet { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.62); display:none; align-items:flex-end; justify-content:center; }
  #sheet.show { display:flex; animation:fade .2s ease both; }
  #sheet-panel { width:100%; max-width:430px; background:#0f0f12; border:1px solid var(--line); border-bottom:0; border-radius:28px 28px 0 0;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom)); animation:sheetUp .35s var(--spring) both; }
  @keyframes sheetUp { from { transform:translateY(100%); } to { transform:none; } }
  .sh-h { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .sh-t { font-size:21px; font-weight:800; }
  #sh-x { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:24px; line-height:1; }
  .mk { display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; margin-bottom:10px; border-radius:18px; border:1px solid var(--line);
    background:linear-gradient(180deg, var(--card2), var(--card)); color:var(--text); text-align:left; font-family:inherit; }
  .mk.best { border-color:rgba(46,204,113,.6); box-shadow:0 0 0 1px rgba(46,204,113,.25), 0 6px 20px rgba(46,204,113,.18); }
  .mk-i { width:42px; height:42px; border-radius:13px; object-fit:cover; flex:none; background:#222; }
  .mk-n { flex:1; font-weight:700; font-size:16px; display:flex; flex-direction:column; gap:2px; }
  .mk-n em { font-style:normal; font-size:12px; color:var(--up); font-weight:700; }
  .mk-p { font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; text-align:right; }
  .lots-t { margin:14px 2px 8px; color:var(--mute); font-size:13px; font-weight:700; }
  .lot { display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px; margin-bottom:6px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:inherit; text-align:left; font-size:13px; }
  .lot-n { font-weight:800; min-width:64px; } .lot-d { flex:1; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lot-m { color:var(--mute); } .lot-p { font-weight:800; font-variant-numeric:tabular-nums; }
  #sheet-panel { max-height:88vh; overflow-y:auto; }
  .fsel { display:flex; gap:8px; margin:0 0 12px; }
  .fsel select { flex:1; min-width:0; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; font-weight:600; font-family:inherit; appearance:none; -webkit-appearance:none; text-overflow:ellipsis; }
  .fsel select:focus { outline:none; border-color:var(--acc); }
  .shr.fav.on svg, .favb.on svg { fill:var(--acc); stroke:var(--acc); }
  .shr.fav.on, .favb.on { color:var(--acc); }
  .lbrow { display:flex; gap:10px; margin:14px 0 0; } .lbrow .buy { flex:1; margin:0; }
  .favb { flex:none; width:54px; border-radius:18px; border:1px solid var(--line); background:var(--card); color:var(--mute); display:flex; align-items:center; justify-content:center; padding:0; }
  .favb svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round; }
  .unfav { flex:none; margin-left:10px; width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--mute); display:flex; align-items:center; justify-content:center; padding:0; font-size:24px; line-height:1; }
  .unfav svg { width:20px; height:20px; fill:var(--acc); stroke:var(--acc); stroke-width:1.5; stroke-linejoin:round; }
  #pf-tabs button { font-size:12px; padding:7px 2px; } #pf-tabs { gap:6px; }
  #pf-fsub button i { font-style:normal; opacity:.7; margin-left:4px; }
  .pcard { border:1px solid var(--line); background:linear-gradient(180deg, var(--card2), var(--card)); border-radius:20px; padding:14px 16px; margin-bottom:12px; }
  .qty { display:flex; align-items:center; gap:8px; margin-top:6px; } .qty b { min-width:22px; text-align:center; }
  .qty button { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:18px; padding:0; }
  .frm { display:flex; flex-direction:column; gap:10px; } .frm .buy { margin:0; }
  .frm select, .frm input { width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; font-family:inherit; }
  .buy.alt { background:linear-gradient(135deg, #3ea6ff, #2d7be0); box-shadow:0 8px 24px rgba(62,166,255,.3), inset 0 1px 0 rgba(255,255,255,.3); }
  .addr { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; word-break:break-all; margin:6px 0 10px; }
  .cpy { padding:8px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; font-weight:700; }
  .hero { position:relative; border-radius:26px; padding:16px; margin:0 0 14px; border:1px solid rgba(255,47,185,.38);
    background:radial-gradient(110% 130% at 0% 0%, rgba(255,47,185,.30), transparent 58%), radial-gradient(100% 120% at 100% 100%, rgba(192,38,211,.26), transparent 62%), var(--card);
    box-shadow:0 12px 40px rgba(255,47,185,.18), inset 0 1px 0 rgba(255,255,255,.10); }
  .hero-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .ava { position:relative; width:68px; height:68px; flex:none; border-radius:50%; padding:3px; background:linear-gradient(135deg, #ff2fb9, #c026d3 55%, #7a5cff); box-shadow:0 0 24px rgba(255,47,185,.45); }
  .ava img, .ava i { position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); border-radius:50%; object-fit:cover; background:#17101a; z-index:1; }
  .ava i { display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:800; font-size:22px; z-index:0; }
  .hero-n { min-width:0; } .nm { font-size:22px; font-weight:800; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .un { color:var(--mute); font-size:14px; margin-top:2px; }

  return `<span class="${cls} chg">${arrow}${Math.abs(p).toFixed(2)}%</span>`;
};
const arrowBtn = (on, dir) => on ? `<svg class="arr ${dir === 1 ? '' : 'down'}" viewBox="0 0 24 24"><path d="M12 20V5M5.5 11.5L12 5l6.5 6.5"/></svg>` : '';
const sortRows = (rows, field, dir) => rows.slice().sort((a, b) => {  // без значения всегда внизу
  const x = a[field], y = b[field];
  return x == null ? (y == null ? 0 : 1) : y == null ? -1 : (x - y) * dir;
});
const hubSeg = on => `<div class="seg" id="hub">${['gifts', 'map', 'themes'].map(k => `<button class="rp ${k === on ? 'on' : ''}" data-h="${k}">${T('hub_' + k)}</button>`).join('')}</div>`;

const routes = { gifts: showGifts, themes: showThemes, map: showMap, theme: showTheme, models: showModels, allmodels: showAllModels, cap: showCap, profile: showProfile };
let stack = [], cur = { name: 'gifts' }, restoreState = null, renderAll = false;
function navigate(name, arg) {  // вглубь: запоминаем текущий экран

function goBack() {

// список порциями: первые 30 строк сразу, остальные по мере прокрутки — быстро открывается и не лагает
const CHUNK = 30;
function renderList(box, rows, rowHtml, animate) {
  box._io?.disconnect(); box._sent?.remove(); box.innerHTML = '';
  if (!rows.length) { box.innerHTML = '<div class="empty">' + T('nothing') + '</div>'; return; }
  let shown = 0;
  const more = () => {
    const part = rows.slice(shown, shown + (renderAll ? rows.length : CHUNK));  // при возврате рисуем всё сразу, чтобы прокрутка встала точно
    box.insertAdjacentHTML('beforeend', part.map((r, i) => rowHtml(r, shown + i, animate && shown + i < 10)).join(''));
    shown += part.length;
  };
  more();
  if (shown >= rows.length) return;
  const s = document.createElement('div'); s.style.height = '40px'; box.after(s); box._sent = s;
  box._io = new IntersectionObserver(es => {
    if (!es[0].isIntersecting) return;
    more();
    if (shown >= rows.length) { box._io.disconnect(); s.remove(); } else { box._io.unobserve(s); box._io.observe(s); }
  }, { root: view, rootMargin: '700px' });
  box._io.observe(s);
}

/* ---------- Карта рынка (treemap) ---------- */
let mapPeriod = '1d', mapMode = 'map', topDir = 'up', mapSize = 'up';
// раскладка «квадратами»: чем больше капитализация, тем больше блок
function treemap(items, W, H) {
  const total = items.reduce((a, i) => a + i.v, 0), k = W * H / total;
  const queue = items.map(i => ({ ...i, area: i.v * k })), out = [];
  let x = 0, y = 0, w = W, h = H, row = [];
  const sum = r => r.reduce((a, n) => a + n.area, 0);
  const worst = (r, side) => { const s2 = sum(r), mx = Math.max(...r.map(n => n.area)), mn = Math.min(...r.map(n => n.area)); return Math.max(side * side * mx / (s2 * s2), s2 * s2 / (side * side * mn)); };
  const flush = r => {
    const s2 = sum(r);
    if (w >= h) { const rw = s2 / h; let yy = y; r.forEach(n => { const nh = n.area / rw; out.push({ ...n, x, y: yy, w: rw, h: nh }); yy += nh; }); x += rw; w -= rw; }
    else { const rh = s2 / w; let xx = x; r.forEach(n => { const nw = n.area / rh; out.push({ ...n, x: xx, y, w: nw, h: rh }); xx += nw; }); y += rh; h -= rh; }
  };
  while (queue.length) {
    const side = Math.min(w, h), n = queue[0];
    if (!row.length || worst(row.concat(n), side) <= worst(row, side)) { row.push(n); queue.shift(); } else { flush(row); row = []; }
  }
  if (row.length) flush(row);
  return out;
}
// цвет блока по изменению цены: зелёный рост, красный падение, серый — без изменений
function heat(p) {
  if (p == null || Math.abs(p) < 0.05) return 'linear-gradient(145deg, #3b3f48, #2a2d34)';
  const a = Math.min(Math.abs(p), 12) / 12, l = 24 + a * 20;
  return p > 0 ? `linear-gradient(145deg, hsl(146 70% ${l + 7}%), hsl(150 75% ${l - 4}%))`
               : `linear-gradient(145deg, hsl(358 78% ${l + 7}%), hsl(350 80% ${l - 5}%))`;
}
// пузыри: размер — вес v, расстановка спиралью от центра без наложений
function packCircles(items, W, H) {
  if (!items.length) return [];
  const vmax = Math.max(...items.map(i => i.v)), vmin = Math.min(...items.map(i => i.v)), n = items.length;
  // размер: смесь значения и места в рейтинге, чтобы первые были заметно крупнее последних даже при близких значениях
  const sc = items.map((it, i) => 0.5 * (vmax > vmin ? (it.v - vmin) / (vmax - vmin) : 0) + 0.5 * (n > 1 ? 1 - i / (n - 1) : 1));
  // рядами сверху вниз: самые крупные в первом ряду, самые мелкие в последнем; ряды по центру
  const gap = 6;
  for (let R = Math.min(W, H) * 0.46; R > 18; R *= 0.95) {
    const rs = items.map((it, i) => Math.max(23, R * (0.3 + 0.7 * sc[i])));
    const rows = []; let cur = [], w = 0;
    rs.forEach((r, i) => {
      const need = 2 * r + (cur.length ? gap : 0);
      if (cur.length && w + need > W - 4) { rows.push(cur); cur = []; w = 0; }
      w += 2 * r + (cur.length ? gap : 0); cur.push(i);
    });
    if (cur.length) rows.push(cur);
    const hs = rows.map(row => 2 * Math.max(...row.map(i => rs[i])));
    const total = hs.reduce((a, b) => a + b, 0) + gap * (rows.length - 1);
    if (total > H - 4) continue;
    const placed = []; let y = (H - total) / 2;
    rows.forEach((row, k) => {
      const rw = row.reduce((a, i) => a + 2 * rs[i], 0) + gap * (row.length - 1);
      let x = (W - rw) / 2;
      row.forEach(i => { placed.push({ ...items[i], r: rs[i], x: x + rs[i], y: y + hs[k] / 2 }); x += 2 * rs[i] + gap; });
      y += hs[k] + gap;
    });
    return placed;
  }
  return [];
}

// график с осями: подписи времени подбираются по длине периода (часы, дни, месяцы, годы)
function chartSvg(fl, sl, H, cur) {
  const all = fl.concat(sl, cur ? [cur] : []);
  const t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));
  let lo = Math.min(...all.map(p => p.v)), hi = Math.max(...all.map(p => p.v));
  if (hi === lo) { lo *= 0.97; hi *= 1.03; }  // цена не менялась — шкала с запасом, линия по центру
  const W = 340, L = 46, R = 10, T = 10, B = 24;
  const x = t => L + (t1 === t0 ? .5 : (t - t0) / (t1 - t0)) * (W - L - R);
  const y = v => T + (hi === lo ? .5 : 1 - (v - lo) / (hi - lo)) * (H - T - B);
  const span = (t1 - t0) / 86400;
  const multiYear = new Date(t0 * 1000).getFullYear() !== new Date(t1 * 1000).getFullYear();  // год подписываем, только если график его пересекает
  const tfmt = t => { const d = new Date(t * 1000);
    return span <= 2 ? d.toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' })
      : span <= 45 ? d.toLocaleDateString(LOC(), { day: 'numeric', month: 'short' })
      : (LANG === 'ru' ? ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'][d.getMonth()]
          : d.toLocaleDateString('en-US', { month: 'short' })) + (multiYear ? ' ' + d.getFullYear() : ''); };
  const n = 4, ticks = Array.from({ length: n }, (_, i) => t0 + (t1 - t0) * i / (n - 1));
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="#1f1f22"/>` +
    `<text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" fill="#8a8a90" font-size="11" text-anchor="end">${fmtK(v)}</text>`).join('');
  const xt = ticks.map((t, i) => `<line x1="${x(t).toFixed(1)}" y1="${T}" x2="${x(t).toFixed(1)}" y2="${H - B}" stroke="#151517"/>` +
    `<text x="${x(t).toFixed(1)}" y="${H - 6}" fill="#8a8a90" font-size="11" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${tfmt(t)}</text>`).join('');
  const line = fl.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const dots = sl.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6" fill="#2ecc71"/>`).join('');
  const now = cur ? `<circle cx="${x(cur.t).toFixed(1)}" cy="${y(cur.v).toFixed(1)}" r="4.5" fill="#fff" stroke="#ff2fb9" stroke-width="2"/>` : '';
  const gid = 'cg' + Math.random().toString(36).slice(2, 7);
  const area = fl.length > 1 ? `<path d="${line}L${x(fl[fl.length - 1].t).toFixed(1)},${H - B}L${x(fl[0].t).toFixed(1)},${H - B}Z" fill="url(#${gid})"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2fb9" stop-opacity=".28"/><stop offset="1" stop-color="#ff2fb9" stop-opacity="0"/></linearGradient></defs>${xt}${grid}${area}` +
    `${fl.length > 1 ? `<path d="${line}" fill="none" stroke="#ff2fb9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}${now}</svg>`;
}

    const on = !this.isFav(kind, gift, model);
    this.me.favs = on ? [{ kind, gift, model }, ...this.me.favs] : this.me.favs.filter(f => !(f.kind === kind && f.gift === gift && (f.model || '') === (model || '')));
    this.stars(); hap(); this.save();
    if (this.auth) try { await this.req('POST', '/fav', { kind, gift, model }); } catch (e) { this.load(); }
  },
  async hold(gift, model, qty) {
    const rest = this.me.portfolio.filter(h => !(h.gift === gift && (h.model || '') === (model || '')));
    this.me.portfolio = qty > 0 ? [...rest, { gift, model, qty }] : rest; this.save();
    if (this.auth) try { await this.req('POST', '/portfolio', { gift, model, qty }); } catch (e) { this.load(); }
  },
  async addAlert(gift, model, cond, value) {
    if (!this.auth) return false;
    try { await this.req('POST', '/alerts', { gift, model, cond, value }); this.me = await this.req('GET', '/me'); return true; } catch (e) { return false; }
  },
  async delAlert(id) { this.me.alerts = this.me.alerts.filter(a => a.id !== id); try { await this.req('DELETE', '/alerts/' + id); } catch (e) {} },
  stars() {  // обновляем все звёзды на экране
    document.querySelectorAll('#fav').forEach(b => b.classList.toggle('on', this.isFav(b.dataset.k, b.dataset.g, b.dataset.m)));
    if (lbState) $('#lb-fav')?.classList.toggle('on', this.isFav('model', lbState.gift, lbState.m.name));
  },
};

// «Поделиться» из профиля: портфель, избранные модели, подарки или сэты уходят текстом со ссылкой на бота
function shareOut(text) {
  const url = BOT_LINK, full = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text.slice(0, 3500));
  try { if (tg?.openTelegramLink) { tg.openTelegramLink(full); return; } } catch (e) {}
  try { if (navigator.share) { navigator.share({ url, text }); return; } } catch (e) {}
  window.open(full, '_blank');
}

` + favs('gift').map(f => { const g = giftsCache.find(x => x.name === f.gift); return `• ${f.gift}${g ? ' — ' + fmt(g.floor_ton) + ' GRAM' : ''}`; }).join('\n');
        } else if (k === 'set') {

async function drawPort(body, id) {
  const hs = U.me.portfolio;
  await Promise.all([...new Set(hs.filter(h => h.model).map(h => h.gift))].map(g => modelsOf(g).catch(() => [])));
  if (id !== viewId) return;
  let total = 0, prev = 0;
  const rows = hs.map(h => {
    const g = giftsCache.find(x => x.name === h.gift), price = priceOf(h.gift, h.model, mpCache[h.gift]), val = price != null ? price * h.qty : null, ch = g ? giftChange(g) : null;
    if (val != null) { total += val; prev += ch != null ? val / (1 + ch / 100) : val; }
    return { h, price, val };
  }).sort((a, b) => (b.val || 0) - (a.val || 0));
  const diff = prev ? (total / prev - 1) * 100 : null;
  body.innerHTML = `<div class="pcard"><div class="s" style="color:var(--mute)">${T('pf_total')}</div><div class="gprice" style="margin-top:2px">${fmt(total)} GRAM</div><div class="s">${diff != null && rows.length ? chg(+diff.toFixed(2)) + ' <span style="color:var(--mute)">' + T('p_' + giftPeriod) + '</span>' : ''}</div></div>
    <button class="buy rp" id="pf-add" style="margin-bottom:12px">${T('pf_add')}</button>
    ${rows.length ? '' : `<div class="empty">${T('pf_port_empty')}</div>`}
    ${rows.map(({ h, price, val }, i) => `<div class="row" data-i="${i}">${imgTag(h.model ? mimg(h.gift, h.model) : img(h.gift))}<div class="t"><div class="n">${esc(h.model || h.gift)}</div><div class="s">${h.model ? esc(h.gift) + ' · ' : ''}${fmt(price)}${GEM}</div>
      <div class="qty"><button class="rp" data-a="-">−</button><b>${h.qty}</b><button class="rp" data-a="+">+</button></div></div><div class="p">${fmt(val)}${GEM}</div><button class="unfav rp" data-del="1" aria-label="x">×</button></div>`).join('')}`;
  body.onclick = e => {
    const row = e.target.closest('[data-i]'); if (!row) return; hap(); const r = rows[+row.dataset.i];
    if (e.target.closest('[data-del]')) U.hold(r.h.gift, r.h.model, 0).then(() => drawPort(body, id));
    else if (e.target.closest('[data-a]')) U.hold(r.h.gift, r.h.model, Math.max(0, r.h.qty + (e.target.closest('[data-a]').dataset.a === '+' ? 1 : -1))).then(() => drawPort(body, id));
  };
  $('#pf-add').onclick = () => holdingForm(() => drawPort(body, id));
}

// «Поделиться»: ссылка на бота с параметром, по которому приложение открывается сразу на нужном экране
const BOT_LINK = 'https://t.me/gift20bot';
function sharePayload() {
  if (cur.name === 'models' && cur.arg) return { p: 'g_' + short(cur.arg), text: cur.arg };
  if (cur.name === 'theme' && cur.arg) return { p: 't_' + cur.arg, text: (themesCache?.find(t => t.id === cur.arg)?.[LANG === 'en' ? 'title_en' : 'title']) || cur.arg };
  return { p: '', text: T('title_gifts') };
}
function shareCurrent() {
  const { p, text } = sharePayload(), url = BOT_LINK + (p ? '?start=' + p : '');
  hap();
  const full = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text + ' — Gift Hub');
  try { if (tg?.openTelegramLink) { tg.openTelegramLink(full); return; } } catch (e) {}
  try { if (navigator.share) { navigator.share({ url, text }); return; } } catch (e) {}
  window.open(full, '_blank');
}
document.addEventListener('click', e => { if (e.target.closest('#share')) shareCurrent(); });
async function openDeepLink(sp) {
  try {
    giftsCache ||= await api('/gifts');

    if (sp.startsWith('t_')) { themesCache ||= await api('/themes'); if (themesCache.find(t => t.id === sp.slice(2))) navigate('theme', sp.slice(2)); }
  } catch (e) {}
}
